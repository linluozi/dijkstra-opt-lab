name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Check that results.json stays in sync with the chart script
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python -c "import json,sys; d=json.load(open('results.json')); assert d['cases'] and d['density_sweep'], 'results.json missing sections'; print('results.json ok:', len(d['cases']), 'cases')"
